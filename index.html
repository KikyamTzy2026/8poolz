<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>8-Ball Pool Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 50% 30%,#13284a,#050b16 70%);font-family:'Segoe UI',system-ui,sans-serif;color:#e8ecf3;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#hud{width:min(900px,100vw);display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;padding:0 6px 12px}
.player{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 14px;transition:.25s;min-height:62px}
#p2{text-align:right}#p2 .balls-left{justify-content:flex-end}
.player.active{border-color:#fbbf24;box-shadow:0 0 18px rgba(251,191,36,.45)}
.name{font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:1.5px}
.balls-left{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.mini-ball{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
#center{text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:130px}
#timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;color:#fbbf24;text-shadow:0 0 14px rgba(251,191,36,.5)}
#timer.low{color:#ef4444;text-shadow:0 0 14px rgba(239,68,68,.7);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#status{font-size:12px;opacity:.8;margin-top:2px}
canvas{display:block;border-radius:14px;box-shadow:0 25px 70px rgba(0,0,0,.7),0 0 0 3px #2a1608;max-width:100vw;max-height:80vh;cursor:crosshair;touch-action:none}
#power-wrap{margin-top:12px;width:min(420px,80vw);height:12px;background:rgba(0,0,0,.5);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
#power-bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
.hint{font-size:12px;opacity:.5;margin-top:8px}
#menu{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(19,40,74,.97),rgba(5,11,22,.98));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:12px}
#menu h1{font-size:46px;letter-spacing:3px;background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#menu p{opacity:.65;margin-bottom:10px;letter-spacing:2px;font-size:13px;text-transform:uppercase}
.btn{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;padding:13px 34px;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer;transition:.15s;min-width:240px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(37,99,235,.45)}
.btn.secondary{background:linear-gradient(135deg,#475569,#334155)}
.btn.green{background:linear-gradient(135deg,#16a34a,#15803d)}
input[type=text]{padding:12px 16px;border-radius:10px;border:2px solid #334155;background:#1e293b;color:#fff;font-size:15px;width:240px;text-align:center}
input[type=text]:focus{outline:0;border-color:#fbbf24}
#room-info{font-size:13px;opacity:.7}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(5,11,22,.92);border:2px solid #fbbf24;padding:22px 44px;border-radius:18px;font-size:22px;font-weight:700;z-index:15;display:none;text-align:center;pointer-events:none;line-height:1.5}
#message .btn{pointer-events:auto;margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div id="hud">
  <div class="player" id="p1"><div class="name" id="p1-name">Player 1</div><div class="type" id="p1-type">Open</div><div class="balls-left" id="p1-balls"></div></div>
  <div id="center"><div id="timer">2:00</div><div id="status">Break shot</div></div>
  <div class="player" id="p2"><div class="name" id="p2-name">Player 2</div><div class="type" id="p2-type">Open</div><div class="balls-left" id="p2-balls"></div></div>
</div>
<div id="power-wrap"><div id="power-bar"></div></div>
<div class="hint">Press &amp; drag backwards to aim • longer pull = more power • release to shoot</div>
<div id="message"></div>
<div id="menu">
  <h1>🎱 8-BALL POOL</h1>
  <p>Pro Edition • 2-Minute Match</p>
  <input type="text" id="name-1" placeholder="Player 1 name" maxlength="14" />
  <input type="text" id="name-2" placeholder="Player 2 name (local only)" maxlength="14" />
  <button class="btn green" id="btn-local">Local 1v1 (Same Device)</button>
  <button class="btn" id="btn-create">Create Online Room</button>
  <button class="btn secondary" id="btn-join">Join Room</button>
  <input type="text" id="room-input" placeholder="ROOM CODE" maxlength="6" style="display:none" />
  <button class="btn green" id="btn-join-confirm" style="display:none">Join</button>
  <div id="room-info"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
