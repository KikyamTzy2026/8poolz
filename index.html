<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>8-Ball Pool 1v1</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1628;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .player-info {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .player {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 16px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .player.active {
      border-color: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
    }
    .player .name { font-weight: 600; font-size: 14px; }
    .player .type { font-size: 12px; opacity: 0.7; margin-top: 2px; }
    .balls-left {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
      max-width: 140px;
    }
    .mini-ball {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.3);
    }
    #status {
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      padding: 6px 16px;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
    }
    #power-bar-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 14px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
    }
    #power-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      transition: width 0.05s linear;
    }
    #menu {
      position: absolute;
      inset: 0;
      background: rgba(10, 22, 40, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 16px;
    }
    #menu h1 {
      font-size: 42px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #menu p { opacity: 0.7; margin-bottom: 20px; }
    .btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 220px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,99,235,0.4); }
    .btn.secondary { background: linear-gradient(135deg, #475569, #334155); }
    .btn.green { background: linear-gradient(135deg, #16a34a, #15803d); }
    input[type="text"] {
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 16px;
      width: 220px;
      text-align: center;
      letter-spacing: 2px;
    }
    input[type="text"]:focus { outline: none; border-color: #3b82f6; }
    #room-info {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 8px;
    }
    canvas {
      display: block;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      max-width: 100vw;
      max-height: 85vh;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 20px 40px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 600;
      z-index: 15;
      display: none;
      text-align: center;
      pointer-events: none;
    }
    .hint {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: 0.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="top-bar">
      <div class="player-info">
        <div class="player" id="p1">
          <div class="name">Player 1</div>
          <div class="type" id="p1-type">—</div>
          <div class="balls-left" id="p1-balls"></div>
        </div>
        <div class="player" id="p2">
          <div class="name">Player 2</div>
          <div class="type" id="p2-type">—</div>
          <div class="balls-left" id="p2-balls"></div>
        </div>
      </div>
      <div id="status">Your turn</div>
    </div>
  </div>

  <div id="power-bar-container"><div id="power-bar"></div></div>
  <div id="message"></div>
  <div class="hint" id="hint">Click & drag to aim • Release to shoot</div>

  <div id="menu">
    <h1>🎱 8-Ball Pool</h1>
    <p>1v1 Multiplayer Ready</p>
    <button class="btn green" id="btn-local">Local 1v1 (Same Device)</button>
    <button class="btn" id="btn-create">Create Online Room</button>
    <button class="btn secondary" id="btn-join">Join Room</button>
    <input type="text" id="room-input" placeholder="ROOM CODE" maxlength="6" style="display:none; margin-top:8px;" />
    <button class="btn green" id="btn-join-confirm" style="display:none;">Join</button>
    <div id="room-info"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
